apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rag
resources:
  - producer-job.yaml
  - producer-dashboard.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus-scrape.yml
  - name: grafana-datasource
    files:
      - prometheus.yml=grafana/datasource.yml
  - name: grafana-provider
    files:
      - dashboards.yml=grafana/dashboards.yml
  - name: producer-dashboard
    files:
      - producer.json=grafana/producer.json
images:
  - name: rag-lakehouse-producer
    newName: rag-lakehouse-producer
    newTag: local

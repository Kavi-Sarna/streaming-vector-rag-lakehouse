# Local backing services. The producer runs on the host. make flink-job submits the dedup job.
# The object store is Silo (pgsty/silo): the MinIO S3 API, because the
# official MinIO image is no longer anonymously pullable.
name: rag-lakehouse

services:
  redpanda:
    image: docker.io/redpandadata/redpanda:v26.2.6
    entrypoint: ["/usr/bin/rpk"]
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9093,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9093,external://localhost:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --schema-registry-addr
      - internal://0.0.0.0:8081
      - --pandaproxy-addr
      - internal://0.0.0.0:8082
    ports:
      - "9092:9092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test:
        - CMD-SHELL
        - rpk cluster health && { rpk topic describe document.events.v1 -X brokers=127.0.0.1:9093 >/dev/null 2>&1 || rpk topic create document.events.v1 -p 1 -r 1 -X brokers=127.0.0.1:9093; } && { rpk topic describe document.chunks.v1 -X brokers=127.0.0.1:9093 >/dev/null 2>&1 || rpk topic create document.chunks.v1 -p 1 -r 1 -X brokers=127.0.0.1:9093; }
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 15s

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test:
        - CMD-SHELL
        - silo healthcheck ready && mc alias set local http://127.0.0.1:9000 minio minio12345 && mc mb --ignore-existing local/lakehouse
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  redis:
    image: docker.io/redis/redis-stack-server:7.4.0-v8
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  flink-jobmanager:
    image: docker.io/library/flink:1.20.5-scala_2.12-java17
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        taskmanager.numberOfTaskSlots: 2
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  flink-taskmanager:
    image: docker.io/library/flink:1.20.5-scala_2.12-java17
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/flink-jobmanager/6123'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  mock-embedder:
    build:
      context: ../..
      dockerfile: infra/docker/mock-embedder.Dockerfile
    image: rag-lakehouse-mock-embedder:local
    ports:
      - "8091:8080"
    healthcheck:
      test: ["CMD", "/mock-embedder", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  grafana:
    image: docker.io/grafana/grafana:12.1.1
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID: producer
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ../k8s/grafana/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ../k8s/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../k8s/grafana/producer.json:/etc/grafana/provisioning/dashboards/json/producer.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  redpanda:
  minio:
  redis:
  prometheus:

name: network

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  id-token: write

concurrency:
  group: network-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan demo stack
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@v7

      - name: Require AWS account id
        run: |
          if [ -z "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "Set the repository variable AWS_ACCOUNT_ID. It is the 12-digit account id from 'aws sts get-caller-identity'." >&2
            exit 1
          fi

      - name: Install Terraform
        run: |
          cd /tmp
          curl -sSfL -O https://releases.hashicorp.com/terraform/1.16.7/terraform_1.16.7_linux_amd64.zip
          echo "5454efcf7fc87f0c2113111b9a5c7182f0ca1c6f0f23a1e110a50770a8fe473b  terraform_1.16.7_linux_amd64.zip" | sha256sum -c -
          sudo unzip -o terraform_1.16.7_linux_amd64.zip -d /usr/local/bin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rag-demo-github-deploy

      - name: Write backend config
        working-directory: infra/terraform/environments/demo
        run: printf 'bucket = "rag-demo-tfstate-%s"\n' "${{ vars.AWS_ACCOUNT_ID }}" > backend.hcl

      - name: Plan
        id: plan
        working-directory: infra/terraform/environments/demo
        run: |
          terraform init -backend-config=backend.hcl -input=false
          set +e
          terraform plan -detailed-exitcode -input=false -out=tfplan -target=module.networking -target=module.schema_registry -target=module.ecr -target=module.compute_eks -target=module.msk
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "Plan has no changes. Apply will not wait for approval."
          fi
          terraform show -no-color tfplan > plan.txt
          {
            echo "## Demo plan"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/environments/demo/tfplan
          retention-days: 1

  apply:
    name: Apply demo stack
    needs: plan
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v7

      - name: Install Terraform
        run: |
          cd /tmp
          curl -sSfL -O https://releases.hashicorp.com/terraform/1.16.7/terraform_1.16.7_linux_amd64.zip
          echo "5454efcf7fc87f0c2113111b9a5c7182f0ca1c6f0f23a1e110a50770a8fe473b  terraform_1.16.7_linux_amd64.zip" | sha256sum -c -
          sudo unzip -o terraform_1.16.7_linux_amd64.zip -d /usr/local/bin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rag-demo-github-deploy

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/terraform/environments/demo

      - name: Write backend config
        working-directory: infra/terraform/environments/demo
        run: printf 'bucket = "rag-demo-tfstate-%s"\n' "${{ vars.AWS_ACCOUNT_ID }}" > backend.hcl

      - name: Apply saved plan
        working-directory: infra/terraform/environments/demo
        run: |
          terraform init -backend-config=backend.hcl -input=false
          terraform apply -input=false tfplan

  unblock-deploy:
    name: Unblock deploy
    needs: plan
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.plan.result == 'success' && needs.plan.outputs.changes == 'false'
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Release approved
        run: echo "Plan has no changes. Deploy release approved."

  unblock-deploy-after-apply:
    name: Unblock deploy after apply
    needs: [plan, apply]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository && needs.plan.result == 'success' && needs.plan.outputs.changes == 'true' && needs.apply.result == 'success'
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Release approved
        run: echo "Apply succeeded. Deploy release approved."

  deploy:
    name: Deploy
    needs: [unblock-deploy, unblock-deploy-after-apply]
    if: always() && (needs.unblock-deploy.result == 'success' || needs.unblock-deploy-after-apply.result == 'success')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
